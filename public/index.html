<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Signature</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/style.css">
</head>
<body>

<div class="signature-container">
  <p class="tagline">Best Regards,</p>
  <table cellpadding="0" cellspacing="0" border="0" class="signature-table">
    <tr>
      <!-- Logo Section -->
      <td class="logo-section">
        <img src="../assets/images/bg-white-updated.png" alt="Noize Group Logos" class="logo-image">
      </td>

      <!-- Info Section -->
      <td class="info-section">
        <p class="name">Your Name</p>
        <p class="role">Your Designation</p>

        <p class="contact-line">
          <img src="../assets/icons/call-icon.png" alt="Phone" class="icon">
          <a href="tel:#">+8801XXXXXXXXX</a>
        </p>

        <p class="contact-line">
          <img src="../assets/icons/email-icon.png" alt="Email" class="icon">
          <a href="mailto:#">Your Email Address</a>
        </p>

        <p class="contact-line">
          <img src="../assets/icons/location-icon.png" alt="Location" class="icon">
          <span>House: 16–17, Level:10, Road: 12, Sector: 6, Uttara, Dhaka-1230</span>
        </p>

        <p class="contact-line">
          <img src="../assets/icons/link-icon.png" alt="Website" class="icon">
          <a href="https://noize-group.com" target="_blank" rel="noopener">noize‑group.com</a>
        </p>
      </td>
    </tr>
  </table>
</div>

</body>
</html>
